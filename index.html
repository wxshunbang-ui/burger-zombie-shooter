<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>酱爆僵尸：汉堡节大作战</title>
<link rel="preload" as="image" href="assets/cover.jpg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a1a10; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) 14px 0; color: #fff;
    font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.45); display: none; }
  #hud .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #hearts { font-size: 22px; letter-spacing: 1px; white-space: nowrap; }
  #wave { font-size: 16px; background: rgba(0,0,0,.35); padding: 4px 12px; border-radius: 99px; white-space: nowrap; }
  #right { text-align: right; }
  #score { font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
  #combo { font-size: 14px; color: #ffd84a; height: 18px; }
  #buffs { margin-top: 6px; display: flex; gap: 6px; }
  #buffs span { background: rgba(0,0,0,.4); padding: 3px 9px; border-radius: 99px; font-size: 14px; }
  #pauseBtn { pointer-events: auto; position: fixed; right: 12px; bottom: max(14px, env(safe-area-inset-bottom));
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 18px; }

  #banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; color: #fff; font-size: 44px; font-weight: 900;
    text-shadow: 0 4px 0 #b3261e, 0 8px 18px rgba(0,0,0,.5); pointer-events: none; opacity: 0; transform: scale(.7);
    transition: opacity .25s, transform .25s; }
  #banner.show { opacity: 1; transform: scale(1); }
  #banner small { display: block; font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,.5); margin-top: 6px; }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: radial-gradient(ellipse at center, rgba(60,20,10,.72), rgba(15,6,3,.92)); }
  .overlay.hidden { display: none; }
  .card { width: min(440px, 100%); text-align: center; color: #fff5e0; }
  .logo { font-size: 76px; line-height: 1; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
  h1 { font-size: 40px; font-weight: 900; margin: 10px 0 4px; color: #ffd84a; text-shadow: 0 4px 0 #b3261e, 0 10px 24px rgba(0,0,0,.6); letter-spacing: 2px; }
  h2 { font-size: 20px; font-weight: 700; color: #ff8a65; margin-bottom: 18px; }
  .how { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 14px 16px;
    font-size: 15px; line-height: 1.9; text-align: left; margin-bottom: 20px; }
  .how b { color: #ffd84a; }
  .touch-only { display: none; }
  @media (pointer: coarse) { .touch-only { display: block; } .mouse-only { display: none; } }
  button.go { font: inherit; font-size: 22px; font-weight: 900; color: #5a1a00; background: linear-gradient(#ffe066, #ffb300);
    border: 0; border-radius: 99px; padding: 14px 46px; box-shadow: 0 6px 0 #b36b00, 0 14px 24px rgba(0,0,0,.4); cursor: pointer; }
  button.go:active { transform: translateY(4px); box-shadow: 0 2px 0 #b36b00; }
  .stats { display: flex; justify-content: center; gap: 12px; margin: 16px 0 22px; }
  .stats div { background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px 16px; min-width: 92px; }
  .stats i { display: block; font-style: normal; font-size: 13px; opacity: .75; }
  .stats b { font-size: 26px; color: #ffd84a; font-variant-numeric: tabular-nums; }

  /* ---------- 封面海报 ---------- */
  #startScreen { --pw: 100vw; display: block; padding: 0; background: #140a12; overflow: hidden; }
  #startScreen.hidden { display: none; }
  .cover-bg { position: absolute; inset: -60px; background: url(assets/cover.jpg) center / cover; filter: blur(30px) brightness(.4); }
  .poster { position: absolute; left: 0; top: 0; width: 100%; }
  .poster img { display: block; width: 100%; height: auto; }
  .title-wrap { position: absolute; left: 0; right: 0; top: 2%; text-align: center; transform: rotate(-3deg); pointer-events: none; }
  .gtitle { margin: 0; font-size: calc(var(--pw) * .15); line-height: 1; font-weight: 900; letter-spacing: .04em; color: #ffd84a;
    -webkit-text-stroke: calc(var(--pw) * .014) #7a0f0a; paint-order: stroke fill;
    text-shadow: 0 .06em 0 #b3261e, 0 .12em .3em rgba(0,0,0,.65); animation: titlePop 2.2s ease-in-out infinite; }
  @keyframes titlePop { 50% { transform: scale(1.04); } }
  .gsub { display: inline-block; margin-top: .1em; font-size: calc(var(--pw) * .046); font-weight: 900; color: #fff; letter-spacing: .12em;
    background: #e53935; padding: .12em .7em .16em; border-radius: 99px; border: calc(var(--pw) * .006) solid #fff;
    box-shadow: 0 .12em 0 #7a0f0a, 0 .3em .6em rgba(0,0,0,.5); }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; color: #fff5e0;
    padding: 80px 18px max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(rgba(20,10,18,0), rgba(20,10,18,.94) 80px, #140a12); }
  .panel .how { background: rgba(20,10,18,.55); font-size: 14px; line-height: 1.8; margin-bottom: 16px; }
  .panel .tagline { display: none; font-size: 22px; font-weight: 900; color: #ffd84a; margin-bottom: 16px; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 1/1) {
    #startScreen { --pw: 66.667vh; display: flex; align-items: center; justify-content: center; }
    .poster { position: relative; flex: none; width: var(--pw); height: 100%; box-shadow: 0 0 60px rgba(0,0,0,.7); }
    .poster img { height: 100%; object-fit: cover; }
    .panel { position: relative; width: min(440px, calc(100vw - var(--pw))); padding: 24px; background: none; }
    .panel .how { font-size: 15px; line-height: 1.9; margin-bottom: 22px; }
    .panel .tagline { display: block; }
  }
  #newBest { color: #7CFC9A; font-weight: 800; height: 22px; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="row">
    <div>
      <div id="hearts"></div>
      <div id="buffs"></div>
    </div>
    <div id="wave">第 1 波</div>
    <div id="right">
      <div id="score">0</div>
      <div id="combo"></div>
    </div>
  </div>
  <button id="pauseBtn" aria-label="暂停">⏸</button>
</div>

<div id="banner"></div>

<div id="startScreen" class="overlay">
  <div class="cover-bg"></div>
  <div class="poster">
    <img src="assets/cover.jpg" alt="金发女孩举着两个巨型汉堡在汉堡节上跳舞，身后是一群僵尸" draggable="false">
    <div class="title-wrap">
      <h1 class="gtitle">酱爆僵尸</h1>
      <div class="gsub">汉堡节大作战</div>
    </div>
  </div>
  <div class="panel">
    <div class="tagline">僵尸想抢汉堡？先问问我的番茄酱！</div>
    <div class="how">
      <div class="mouse-only">🎮 <b>WASD / 方向键</b> 移动，<b>鼠标</b> 瞄准，<b>按住左键</b> 喷酱</div>
      <div class="touch-only">🎮 <b>按住屏幕拖动</b> 移动，会<b>自动瞄准、自动喷酱</b></div>
      <div>🍔 回血　🍟 三连发　🥤 极速连射　🌶️ 辣椒大爆炸</div>
      <div>🧟 僵尸一波比一波多，每 5 波来一只 <b>僵尸王</b></div>
    </div>
    <button class="go" id="startBtn">开始营业！</button>
  </div>
</div>

<div id="overScreen" class="overlay hidden">
  <div class="card">
    <div class="logo">🪦</div>
    <h1>摊位沦陷了</h1>
    <div id="newBest"></div>
    <div class="stats">
      <div><i>得分</i><b id="oScore">0</b></div>
      <div><i>撑到</i><b id="oWave">1</b></div>
      <div><i>最高分</i><b id="oBest">0</b></div>
    </div>
    <button class="go" id="againBtn">再来一局</button>
  </div>
</div>

<div id="pauseScreen" class="overlay hidden">
  <div class="card">
    <div class="logo">⏸</div>
    <h1>暂停中</h1>
    <h2>僵尸们也在休息</h2>
    <button class="go" id="resumeBtn">继续</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let W = 0, H = 0, dpr = 1, u = 1;
  let bg = null, stains = null, sctx = null;
  const spriteCache = new Map();

  // ---------- 画面准备 ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    u = clamp(Math.min(W, H) / 720, 0.72, 1.15);
    spriteCache.clear();
    buildBackground();
    stains = document.createElement('canvas');
    stains.width = cv.width; stains.height = cv.height;
    sctx = stains.getContext('2d');
    sctx.scale(dpr, dpr);
    if (player) { player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 20, H - 20); }
  }

  function sprite(ch, size) {
    size = Math.round(size);
    const key = ch + size;
    let s = spriteCache.get(key);
    if (!s) {
      const pad = Math.ceil(size * 0.3), dim = Math.ceil((size + pad * 2) * dpr);
      s = document.createElement('canvas');
      s.width = dim; s.height = dim;
      const c = s.getContext('2d');
      c.scale(dpr, dpr);
      c.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(ch, size / 2 + pad, size / 2 + pad + size * 0.06);
      s.logical = size + pad * 2;
      spriteCache.set(key, s);
    }
    return s;
  }
  function drawSprite(ch, x, y, size, rot, scaleX) {
    const s = sprite(ch, size), L = s.logical;
    if (rot || (scaleX !== undefined && scaleX !== 1)) {
      ctx.save(); ctx.translate(x, y);
      if (rot) ctx.rotate(rot);
      if (scaleX !== undefined) ctx.scale(scaleX, 1);
      ctx.drawImage(s, -L / 2, -L / 2, L, L);
      ctx.restore();
    } else ctx.drawImage(s, x - L / 2, y - L / 2, L, L);
  }

  function buildBackground() {
    bg = document.createElement('canvas');
    bg.width = cv.width; bg.height = cv.height;
    const c = bg.getContext('2d');
    c.scale(dpr, dpr);
    const t = 56 * u;
    for (let y = 0; y < H; y += t) for (let x = 0; x < W; x += t) {
      const odd = (Math.round(x / t) + Math.round(y / t)) % 2;
      c.fillStyle = odd ? '#e9c98f' : '#f1d6a3';
      c.fillRect(x, y, t + 1, t + 1);
    }
    // 地砖上的小斑点
    for (let i = 0; i < (W * H) / 2600; i++) {
      c.fillStyle = 'rgba(120,80,30,' + rand(0.04, 0.1) + ')';
      c.beginPath(); c.arc(rand(0, W), rand(0, H), rand(1, 3), 0, TAU); c.fill();
    }
    // 节日装饰
    const deco = ['🎪', '🎈', '🍟', '🌭', '🥤', '🎉', '🍔', '🧅', '🎪', '🎈'];
    c.globalAlpha = 0.5;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const n = Math.max(8, Math.round((W + H) / 130));
    for (let i = 0; i < n; i++) {
      const side = i % 4, m = 34 * u;
      let x, y;
      if (side === 0) { x = rand(m, W - m); y = m; }
      else if (side === 1) { x = rand(m, W - m); y = H - m; }
      else if (side === 2) { x = m; y = rand(m * 2, H - m * 2); }
      else { x = W - m; y = rand(m * 2, H - m * 2); }
      c.font = Math.round(rand(30, 46) * u) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      c.fillText(deco[i % deco.length], x, y);
    }
    c.globalAlpha = 1;
    // 暗角
    const g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(60,25,5,0)'); g.addColorStop(1, 'rgba(60,25,5,0.45)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }

  // ---------- 声音 ----------
  let actx = null;
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(f1, f2, dur, type, vol) {
    if (!actx) return;
    try {
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfx = {
    shoot: () => tone(620, 240, 0.07, 'square', 0.025),
    hit: () => tone(240, 110, 0.06, 'sawtooth', 0.04),
    kill: () => tone(180, 50, 0.16, 'sawtooth', 0.06),
    pickup: () => { tone(520, 780, 0.09, 'triangle', 0.08); setTimeout(() => tone(780, 1180, 0.12, 'triangle', 0.08), 80); },
    hurt: () => tone(160, 60, 0.3, 'square', 0.09),
    boom: () => { tone(140, 30, 0.5, 'sawtooth', 0.12); tone(90, 25, 0.6, 'square', 0.08); },
    wave: () => { tone(330, 330, 0.12, 'triangle', 0.07); setTimeout(() => tone(440, 440, 0.12, 'triangle', 0.07), 130); setTimeout(() => tone(660, 660, 0.2, 'triangle', 0.07), 260); },
    over: () => { tone(400, 300, 0.25, 'triangle', 0.09); setTimeout(() => tone(300, 200, 0.25, 'triangle', 0.09), 250); setTimeout(() => tone(200, 80, 0.6, 'triangle', 0.09), 500); },
  };

  // ---------- 游戏数据 ----------
  const TYPES = {
    normal: { ch: '🧟', size: 44, hp: 2, speed: 62, score: 10, blood: '#6fae3c' },
    fast:   { ch: '🧟‍♀️', size: 38, hp: 1, speed: 135, score: 15, blood: '#8bc34a' },
    tank:   { ch: '🧟‍♂️', size: 68, hp: 12, speed: 42, score: 50, blood: '#4e8a2a' },
    boss:   { ch: '🧟‍♂️', size: 120, hp: 60, speed: 36, score: 300, blood: '#3d7a1f' },
  };
  const DROPS = { heal: '🍔', triple: '🍟', rapid: '🥤', chili: '🌶️' };

  let state = 'menu'; // menu | play | paused | over
  let player = null, zombies = [], bullets = [], particles = [], drops = [], texts = [], rings = [];
  let score = 0, wave = 0, toSpawn = 0, spawnTimer = 0, waveBreak = 0, combo = 0, comboTimer = 0;
  let shake = 0, hurtFlash = 0, time = 0;
  let best = 0;
  try { best = +localStorage.getItem('burgerZombieBest') || 0; } catch (e) {}

  function newGame() {
    player = { x: W / 2, y: H / 2, r: 18 * u, hp: 5, maxHp: 5, angle: 0, cool: 0, inv: 0, triple: 0, rapid: 0, recoil: 0, walk: 0 };
    zombies = []; bullets = []; particles = []; drops = []; texts = []; rings = [];
    score = 0; wave = 0; combo = 0; comboTimer = 0; shake = 0; hurtFlash = 0;
    if (sctx) sctx.clearRect(0, 0, W, H);
    nextWave();
    state = 'play';
    $('startScreen').classList.add('hidden');
    $('overScreen').classList.add('hidden');
    $('pauseScreen').classList.add('hidden');
    $('hud').style.display = 'block';
    hudCache = {};
  }

  function nextWave() {
    wave++;
    toSpawn = 5 + wave * 3;
    spawnTimer = 1.2;
    waveBreak = 0;
    const boss = wave % 5 === 0;
    if (boss) spawnZombie('boss');
    showBanner('第 ' + wave + ' 波', boss ? '⚠️ 僵尸王出现了！' : (wave === 1 ? '僵尸闻着香味来了…' : ''));
    sfx.wave();
  }

  let bannerTimer = null;
  function showBanner(title, sub) {
    const b = $('banner');
    b.innerHTML = title + (sub ? '<small>' + sub + '</small>' : '');
    b.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => b.classList.remove('show'), 1700);
  }

  function spawnZombie(kind) {
    if (!kind) {
      const r = Math.random();
      if (wave >= 4 && r > 0.92 - Math.min(0.1, wave * 0.005)) kind = 'tank';
      else if (wave >= 2 && r < Math.min(0.45, 0.12 + wave * 0.025)) kind = 'fast';
      else kind = 'normal';
    }
    const T = TYPES[kind], size = T.size * u, m = size;
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = rand(0, W); y = -m; }
    else if (side === 1) { x = rand(0, W); y = H + m; }
    else if (side === 2) { x = -m; y = rand(0, H); }
    else { x = W + m; y = rand(0, H); }
    let hp = T.hp;
    if (kind === 'boss') hp = 40 + wave * 8;
    else if (kind !== 'fast') hp += Math.floor(wave / 4);
    else hp += Math.floor(wave / 8);
    zombies.push({ kind, ch: T.ch, x, y, size, r: size * 0.4, hp, maxHp: hp,
      speed: T.speed * u * rand(0.9, 1.15) * (1 + Math.min(0.5, wave * 0.02)),
      score: T.score, blood: T.blood, hit: 0, phase: rand(0, TAU), kx: 0, ky: 0 });
  }

  function splat(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), sp = rand(40, 260) * power * u;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(2, 5.5) * u, life: rand(0.25, 0.6), max: 0.6, color });
    }
    if (particles.length > 500) particles.splice(0, particles.length - 500);
  }
  function stain(x, y, color, size) {
    if (!sctx) return;
    sctx.globalAlpha = 0.55; sctx.fillStyle = color;
    for (let i = 0; i < 6; i++) {
      const a = rand(0, TAU), d = rand(0, size);
      sctx.beginPath(); sctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rand(size * 0.15, size * 0.5), 0, TAU); sctx.fill();
    }
    sctx.globalAlpha = 1;
  }
  function floatText(x, y, str, color, size) {
    texts.push({ x, y, str, color: color || '#fff', size: (size || 18) * u, life: 0.9 });
  }

  function fire() {
    const p = player;
    const spread = p.triple > 0 ? [-0.2, 0, 0.2] : [0];
    const sp = 720 * u, mx = p.x + Math.cos(p.angle) * 26 * u, my = p.y + Math.sin(p.angle) * 26 * u;
    for (const s of spread) {
      const a = p.angle + s + rand(-0.03, 0.03);
      bullets.push({ x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 6 * u, life: 1.1,
        color: p.rapid > 0 ? '#ffc400' : '#e53935' });
    }
    p.cool = p.rapid > 0 ? 0.075 : 0.17;
    p.recoil = 1;
    sfx.shoot();
  }

  function damageZombie(z, dmg, dirx, diry) {
    z.hp -= dmg; z.hit = 0.12;
    const kb = z.kind === 'boss' ? 20 : z.kind === 'tank' ? 60 : 170;
    z.kx += dirx * kb * u; z.ky += diry * kb * u;
    if (z.hp <= 0) killZombie(z);
    else sfx.hit();
  }

  function killZombie(z) {
    z.dead = true;
    combo++; comboTimer = 2.2;
    const mult = Math.min(5, 1 + Math.floor(combo / 5));
    const gain = z.score * mult;
    score += gain;
    floatText(z.x, z.y - z.size * 0.4, '+' + gain, mult > 1 ? '#ffd84a' : '#fff', z.kind === 'boss' ? 30 : 18);
    splat(z.x, z.y, z.blood, z.kind === 'boss' ? 60 : z.kind === 'tank' ? 26 : 14, z.kind === 'boss' ? 1.8 : 1);
    stain(z.x, z.y, z.blood, z.size * 0.5);
    shake = Math.max(shake, z.kind === 'boss' ? 18 : z.kind === 'tank' ? 8 : 3.5);
    sfx.kill();
    if (z.kind === 'boss') {
      sfx.boom();
      for (let i = 0; i < 3; i++) dropItem(z.x + rand(-40, 40) * u, z.y + rand(-40, 40) * u, i === 0 ? 'heal' : null);
    } else if (Math.random() < (z.kind === 'tank' ? 0.5 : 0.11)) dropItem(z.x, z.y);
  }

  function dropItem(x, y, kind) {
    if (!kind) {
      const r = Math.random();
      if (player.hp < player.maxHp && r < 0.35) kind = 'heal';
      else if (r < 0.6) kind = 'triple';
      else if (r < 0.87) kind = 'rapid';
      else kind = 'chili';
    }
    drops.push({ kind, ch: DROPS[kind], x: clamp(x, 30, W - 30), y: clamp(y, 60, H - 30), life: 10, t: 0 });
  }

  function pickup(d) {
    const p = player;
    sfx.pickup();
    if (d.kind === 'heal') {
      if (p.hp < p.maxHp) { p.hp++; floatText(p.x, p.y - 30 * u, '❤️ +1', '#ff8a80', 20); }
      else { score += 50; floatText(p.x, p.y - 30 * u, '+50', '#ffd84a', 20); }
    } else if (d.kind === 'triple') { p.triple = 8; floatText(p.x, p.y - 30 * u, '三连发！', '#ffd84a', 20); }
    else if (d.kind === 'rapid') { p.rapid = 7; floatText(p.x, p.y - 30 * u, '极速连射！', '#ffd84a', 20); }
    else if (d.kind === 'chili') {
      const R = 260 * u;
      rings.push({ x: p.x, y: p.y, r: 10, max: R, life: 0.45 });
      shake = 20; sfx.boom();
      splat(p.x, p.y, '#ff6d00', 50, 2);
      for (const z of zombies) {
        if (z.dead) continue;
        const dx = z.x - p.x, dy = z.y - p.y, dist = Math.hypot(dx, dy) || 1;
        if (dist < R + z.r) damageZombie(z, 8, dx / dist, dy / dist);
      }
      floatText(p.x, p.y - 30 * u, '辣椒大爆炸！', '#ff6d00', 24);
    }
  }

  function hurtPlayer(z) {
    const p = player;
    p.hp--; p.inv = 1.1; hurtFlash = 0.35; shake = 14; combo = 0;
    sfx.hurt();
    splat(p.x, p.y, '#ff5252', 16, 1);
    // 把周围僵尸弹开，给玩家喘息空间
    for (const o of zombies) {
      const dx = o.x - p.x, dy = o.y - p.y, d = Math.hypot(dx, dy) || 1;
      if (d < 150 * u) { const k = o.kind === 'boss' ? 180 : 420; o.kx += dx / d * k * u; o.ky += dy / d * k * u; }
    }
    if (p.hp <= 0) gameOver();
  }

  function gameOver() {
    state = 'over';
    sfx.over();
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('burgerZombieBest', String(best)); } catch (e) {} }
    $('oScore').textContent = score;
    $('oWave').textContent = '第' + wave + '波';
    $('oBest').textContent = best;
    $('newBest').textContent = isBest && score > 0 ? '🎉 新纪录！' : '';
    setTimeout(() => { if (state === 'over') { $('overScreen').classList.remove('hidden'); $('hud').style.display = 'none'; } }, 900);
  }

  // ---------- 输入 ----------
  const keys = {};
  const mouse = { x: 0, y: 0, down: false };
  let touchMode = false;
  const joy = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if ((e.code === 'Enter' || e.code === 'Space') && (state === 'menu' || ($('overScreen').classList.contains('hidden') === false))) { initAudio(); newGame(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
  cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; touchMode = false; });
  cv.addEventListener('mousedown', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true; touchMode = false; initAudio(); });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  cv.addEventListener('touchstart', e => {
    e.preventDefault(); touchMode = true; initAudio();
    if (!joy.active) {
      const t = e.changedTouches[0];
      joy.active = true; joy.id = t.identifier; joy.ox = joy.x = t.clientX; joy.oy = joy.y = t.clientY;
    }
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.x = t.clientX; joy.y = t.clientY; }
  }, { passive: false });
  const endTouch = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.active = false; joy.id = null; } };
  cv.addEventListener('touchend', endTouch);
  cv.addEventListener('touchcancel', endTouch);

  function togglePause() {
    if (state === 'play') { state = 'paused'; $('pauseScreen').classList.remove('hidden'); }
    else if (state === 'paused') { state = 'play'; $('pauseScreen').classList.add('hidden'); last = performance.now(); }
  }
  $('startBtn').addEventListener('click', () => { initAudio(); newGame(); });
  $('againBtn').addEventListener('click', () => { initAudio(); newGame(); });
  $('resumeBtn').addEventListener('click', togglePause);
  $('pauseBtn').addEventListener('click', togglePause);
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
  window.addEventListener('resize', resize);

  // ---------- 更新 ----------
  function nearestZombie() {
    let bestZ = null, bd = Infinity;
    for (const z of zombies) {
      if (z.dead) continue;
      if (z.x < -10 || z.x > W + 10 || z.y < -10 || z.y > H + 10) continue;
      const d = (z.x - player.x) ** 2 + (z.y - player.y) ** 2;
      if (d < bd) { bd = d; bestZ = z; }
    }
    return bestZ;
  }

  function update(dt) {
    time += dt;
    const p = player;

    // 移动
    let mx = 0, my = 0;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;
    if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (keys.KeyW || keys.ArrowUp) my -= 1;
    if (keys.KeyS || keys.ArrowDown) my += 1;
    if (joy.active) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), maxR = 56;
      if (d > 6) { const k = Math.min(1, d / maxR) / d; mx = dx * k; my = dy * k; }
      if (d > maxR) { joy.ox = joy.x - dx / d * maxR; joy.oy = joy.y - dy / d * maxR; }
    } else {
      const l = Math.hypot(mx, my);
      if (l > 1) { mx /= l; my /= l; }
    }
    const sp = 235 * u;
    p.x = clamp(p.x + mx * sp * dt, p.r, W - p.r);
    p.y = clamp(p.y + my * sp * dt, p.r, H - p.r);
    if (mx || my) p.walk += dt * 14;

    // 瞄准与射击
    let wantFire = false;
    if (touchMode) {
      const z = nearestZombie();
      if (z) { p.angle = Math.atan2(z.y - p.y, z.x - p.x); wantFire = true; }
    } else {
      p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      wantFire = mouse.down || keys.Space;
    }
    p.cool -= dt; p.inv -= dt; p.recoil = Math.max(0, p.recoil - dt * 9);
    if (p.triple > 0) p.triple -= dt;
    if (p.rapid > 0) p.rapid -= dt;
    if (wantFire && p.cool <= 0) fire();

    // 出怪
    if (toSpawn > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0 && zombies.length < 70) {
        spawnZombie(); toSpawn--;
        spawnTimer = Math.max(0.22, 0.95 - wave * 0.055) * rand(0.6, 1.3);
      }
    } else if (zombies.length === 0) {
      waveBreak += dt;
      if (waveBreak > 1.6) nextWave();
    }

    // 子弹
    for (const b of bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.life = 0;
      if (b.life <= 0) continue;
      for (const z of zombies) {
        if (z.dead) continue;
        const dx = z.x - b.x, dy = z.y - b.y, rr = z.r + b.r;
        if (dx * dx + dy * dy < rr * rr) {
          b.life = 0;
          const l = Math.hypot(b.vx, b.vy) || 1;
          splat(b.x, b.y, b.color, 5, 0.6);
          if (Math.random() < 0.35) stain(b.x, b.y, b.color, 7 * u);
          damageZombie(z, 1, b.vx / l, b.vy / l);
          break;
        }
      }
    }
    bullets = bullets.filter(b => b.life > 0);

    // 僵尸
    for (let i = 0; i < zombies.length; i++) {
      const z = zombies[i];
      if (z.dead) continue;
      const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy) || 1;
      z.x += (dx / d * z.speed + z.kx) * dt;
      z.y += (dy / d * z.speed + z.ky) * dt;
      const damp = Math.pow(0.002, dt);
      z.kx *= damp; z.ky *= damp;
      z.hit -= dt; z.phase += dt * (z.kind === 'fast' ? 13 : 7);
      // 互相挤开
      for (let j = i + 1; j < zombies.length; j++) {
        const o = zombies[j];
        if (o.dead) continue;
        const ex = o.x - z.x, ey = o.y - z.y, min = (z.r + o.r) * 0.9, e2 = ex * ex + ey * ey;
        if (e2 < min * min && e2 > 0.01) {
          const e = Math.sqrt(e2), push = (min - e) / e * 0.5;
          const wz = o.r / (z.r + o.r), wo = 1 - wz;
          z.x -= ex * push * wz * 2; z.y -= ey * push * wz * 2;
          o.x += ex * push * wo * 2; o.y += ey * push * wo * 2;
        }
      }
      if (p.inv <= 0 && state === 'play' && d < z.r + p.r * 0.8) hurtPlayer(z);
    }
    zombies = zombies.filter(z => !z.dead);

    // 掉落物
    for (const d of drops) {
      d.life -= dt; d.t += dt;
      const dx = p.x - d.x, dy = p.y - d.y, dist = Math.hypot(dx, dy) || 1;
      if (dist < 90 * u) { d.x += dx / dist * 300 * u * dt; d.y += dy / dist * 300 * u * dt; }
      if (dist < p.r + 20 * u) { d.life = 0; pickup(d); }
    }
    drops = drops.filter(d => d.life > 0);

    // 特效
    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    for (const t of texts) { t.y -= 46 * u * dt; t.life -= dt; }
    texts = texts.filter(t => t.life > 0);
    for (const r of rings) { r.life -= dt; r.r += (r.max - r.r) * Math.min(1, dt * 12); }
    rings = rings.filter(r => r.life > 0);
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
    shake = Math.max(0, shake - dt * 40);
    hurtFlash = Math.max(0, hurtFlash - dt);
  }

  // ---------- 绘制 ----------
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    ctx.drawImage(bg, 0, 0, W, H);
    if (stains) ctx.drawImage(stains, 0, 0, W, H);

    if (player) {
      // 掉落物
      for (const d of drops) {
        if (d.life < 2.5 && Math.floor(d.life * 8) % 2 === 0) continue;
        const bob = Math.sin(d.t * 5) * 4 * u;
        ctx.fillStyle = 'rgba(255,220,80,0.3)';
        ctx.beginPath(); ctx.arc(d.x, d.y, (20 + Math.sin(d.t * 5) * 3) * u, 0, TAU); ctx.fill();
        drawSprite(d.ch, d.x, d.y + bob, 30 * u);
      }

      // 僵尸（按 y 排序，近的盖住远的）
      zombies.sort((a, b) => a.y - b.y);
      for (const z of zombies) {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y + z.size * 0.42, z.size * 0.36, z.size * 0.13, 0, 0, TAU); ctx.fill();
        const pop = z.hit > 0 ? 1.14 : 1;
        const flip = player.x < z.x ? 1 : -1;
        drawSprite(z.ch, z.x, z.y + Math.abs(Math.sin(z.phase)) * -3 * u, z.size * pop, Math.sin(z.phase) * 0.12, flip);
        if (z.hit > 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 1.05, 0, TAU); ctx.fill();
        }
        if (z.kind === 'boss') drawSprite('👑', z.x, z.y - z.size * 0.58, z.size * 0.38);
        if ((z.kind === 'tank' || z.kind === 'boss') && z.hp < z.maxHp) {
          const bw = z.size * 0.8, bx = z.x - bw / 2, by = z.y - z.size * (z.kind === 'boss' ? 0.86 : 0.62);
          ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 7 * u + 2);
          ctx.fillStyle = '#ff5252'; ctx.fillRect(bx, by, bw * Math.max(0, z.hp / z.maxHp), 7 * u);
        }
      }

      // 玩家
      const p = player;
      if (state !== 'over') {
        const blink = p.inv > 0 && Math.floor(p.inv * 14) % 2 === 0;
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath(); ctx.ellipse(p.x, p.y + 20 * u, 17 * u, 6 * u, 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = blink ? 0.35 : 1;
        // 酱料瓶
        ctx.save();
        ctx.translate(p.x, p.y + 4 * u); ctx.rotate(p.angle);
        const rc = -p.recoil * 5 * u;
        const col = p.rapid > 0 ? '#ffc400' : '#e53935';
        ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
        roundRect(12 * u + rc, -6 * u, 18 * u, 12 * u, 4 * u); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillRect(18 * u + rc, -6 * u, 5 * u, 12 * u);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(30 * u + rc, -4 * u); ctx.lineTo(38 * u + rc, 0); ctx.lineTo(30 * u + rc, 4 * u); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
        drawSprite('🧑‍🍳', p.x, p.y + Math.sin(p.walk) * 2 * u, 42 * u, Math.sin(p.walk) * 0.06);
        ctx.globalAlpha = 1;
      }

      // 子弹
      for (const b of bullets) {
        ctx.strokeStyle = b.color; ctx.lineWidth = b.r * 1.3; ctx.lineCap = 'round'; ctx.globalAlpha = 0.45;
        ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.03, b.y - b.vy * 0.03); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.globalAlpha = 1; ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, TAU); ctx.fill();
      }

      // 粒子
      for (const q of particles) {
        ctx.globalAlpha = clamp(q.life / q.max * 1.5, 0, 1);
        ctx.fillStyle = q.color;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 爆炸环
      for (const r of rings) {
        ctx.globalAlpha = clamp(r.life / 0.45, 0, 1);
        ctx.strokeStyle = '#ff6d00'; ctx.lineWidth = 14 * u;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
        ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 5 * u;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.92, 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // 飘字
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const t of texts) {
        ctx.globalAlpha = clamp(t.life * 2, 0, 1);
        ctx.font = '900 ' + Math.round(t.size) + 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(t.str, t.x, t.y);
        ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // 受伤红屏
    if (hurtFlash > 0) {
      ctx.fillStyle = 'rgba(229,57,53,' + (hurtFlash * 0.9) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // 准星（电脑）
    if (state === 'play' && !touchMode) {
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 11, 0, TAU);
      ctx.moveTo(mouse.x - 17, mouse.y); ctx.lineTo(mouse.x - 6, mouse.y);
      ctx.moveTo(mouse.x + 6, mouse.y); ctx.lineTo(mouse.x + 17, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 17); ctx.lineTo(mouse.x, mouse.y - 6);
      ctx.moveTo(mouse.x, mouse.y + 6); ctx.lineTo(mouse.x, mouse.y + 17);
      ctx.stroke();
    }
    // 摇杆（手机）
    if (state === 'play' && joy.active) {
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 56, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(joy.x, joy.y, 24, 0, TAU); ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  let hudCache = {};
  function setHud(id, val) { if (hudCache[id] !== val) { hudCache[id] = val; $(id).innerHTML = val; } }
  function updateHud() {
    const p = player;
    setHud('hearts', '❤️'.repeat(Math.max(0, p.hp)) + '🖤'.repeat(Math.max(0, p.maxHp - p.hp)));
    setHud('wave', '第 ' + wave + ' 波');
    setHud('score', String(score));
    const mult = Math.min(5, 1 + Math.floor(combo / 5));
    setHud('combo', combo >= 3 ? '连杀 ' + combo + (mult > 1 ? '　×' + mult : '') : '');
    let b = '';
    if (p.triple > 0) b += '<span>🍟 ' + Math.ceil(p.triple) + 's</span>';
    if (p.rapid > 0) b += '<span>🥤 ' + Math.ceil(p.rapid) + 's</span>';
    setHud('buffs', b);
  }

  // ---------- 主循环 ----------
  let last = 0, fadeTimer = 0;
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    if (state === 'play') { update(dt); if (player) updateHud(); }
    else if (state === 'over') {
      // 结束后让特效继续播完
      for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
      particles = particles.filter(q => q.life > 0);
      shake = Math.max(0, shake - dt * 40); hurtFlash = Math.max(0, hurtFlash - dt);
    }
    // 地上的酱渍慢慢淡掉
    fadeTimer += dt;
    if (fadeTimer > 0.6 && sctx && state === 'play') {
      fadeTimer = 0;
      sctx.globalCompositeOperation = 'destination-out';
      sctx.fillStyle = 'rgba(0,0,0,0.025)'; sctx.fillRect(0, 0, W, H);
      sctx.globalCompositeOperation = 'source-over';
    }
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  mouse.x = W / 2; mouse.y = H / 3;
  requestAnimationFrame(t => { last = t; frame(t); });

  // 供自动化测试使用
  window.__game = { newGame, get state() { return state; }, get score() { return score; }, get wave() { return wave; },
    get zombies() { return zombies; }, get player() { return player; }, keys, mouse };
})();
</script>
</body>
</html>
